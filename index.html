<style>
/* Layout: single centred column, sticky category tabs, price rows with dotted leaders. Dark single-look to match the signage. */
:root {
  --bg: #0d0b0a;
  --surface: #17120f;
  --line: #3a2e22;
  --cream: #ecd9a8;
  --muted: #a99878;
  --fire: #d9381e;
  --ember: #f08a24;
  --font-display: 'Oswald', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Mukta', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-script: 'Kalam', 'Segoe Print', cursive;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; background: #0d0b0a; }
body { margin: 0; }
body {
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  padding-inline: 16px;
  padding-block: 0 40px;
}
.wrap { max-width: 560px; margin-inline: auto; }
header { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 24px 14px; text-align: center; }
header img { width: 168px; height: auto; border-radius: 50%; display: block; }
.tag { font-family: var(--font-script); font-size: 22px; color: var(--ember); margin: 0; }
nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); display: flex; gap: 8px; padding-block: 10px;
  border-bottom: 1px solid var(--line);
}
nav a {
  flex: 1; text-align: center; text-decoration: none; color: var(--cream);
  font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; font-size: 13px;
  padding: 9px 2px; border: 1px solid var(--line); min-width: 0;
}
nav a:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
nav a:active { background: var(--fire); border-color: var(--fire); }
section { padding-top: 28px; scroll-margin-top: 64px; }
h2 {
  font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em;
  font-size: 28px; line-height: 1.1; margin: 0 0 4px; color: var(--cream); text-wrap: balance;
}
h2::after { content: ""; display: block; width: 56px; height: 4px; background: var(--fire); margin-top: 8px; }
.note { font-family: var(--font-script); color: var(--ember); font-size: 17px; margin: 8px 0 0; }
ul { list-style: none; margin: 14px 0 0; padding: 0; }
li { display: flex; align-items: baseline; gap: 8px; padding-block: 11px; border-bottom: 1px solid var(--line); }
li:last-child { border-bottom: 0; }
.name { flex: 1; min-width: 0; font-weight: 500; font-size: 17px; }
.name small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
.prices { display: flex; gap: 14px; flex-shrink: 0; font-family: var(--font-display); font-weight: 600; font-size: 18px; font-variant-numeric: tabular-nums; }
.prices span { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.prices em { font-style: normal; font-family: var(--font-body); font-weight: 400; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seasonal { font-family: var(--font-script); color: var(--ember); font-size: 17px; flex-shrink: 0; }
footer { text-align: center; padding-top: 12px; }
footer p { font-family: var(--font-script); font-size: 22px; color: var(--ember); margin: 28px 0 0; }
footer small { color: var(--muted); display: block; margin-top: 6px; }
.follow { display: flex; flex-direction: column; align-items: center; gap: 16px; margin-top: 36px; padding-top: 28px; border-top: 1px solid var(--line); }
.follow h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--cream); }
.logos { display: flex; justify-content: center; gap: 32px; }
.logos a { display: block; line-height: 0; border-radius: 16px; }
.logos a:focus-visible { outline: 2px solid var(--ember); outline-offset: 4px; }
.logos a:active { opacity: .7; }
.logos img { width: 64px; height: 64px; display: block; }
.logos img.wa { border-radius: 16px; }
.gbtn { display: block; width: 100%; max-width: 280px; text-align: center; text-decoration: none; color: var(--cream);
  font-family: var(--font-display); font-weight: 600; font-size: 17px; letter-spacing: .08em; text-transform: uppercase;
  padding: 13px 20px; border: 1px solid var(--fire); background: var(--surface); }
.gbtn:active { background: var(--fire); }
.gbtn:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
</style>
